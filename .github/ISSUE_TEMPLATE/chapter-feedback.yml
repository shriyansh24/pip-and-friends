name: Chapter feedback
description: Tell us about a panel, explanation or exercise that is confusing.
labels: ["content"]
body:
  - type: input
    id: chapter
    attributes:
      label: Book and chapter
      placeholder: Rust ch7
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Panel or exercise
      placeholder: panel 6
  - type: textarea
    id: confusing
    attributes:
      label: What was confusing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would help
      description: Optional. An idea for a clearer panel, example or exercise.
