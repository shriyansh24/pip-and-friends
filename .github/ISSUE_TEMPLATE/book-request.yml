name: Book request
description: Ask for a new book, framework or topic.
labels: ["book-request"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Request type
      options:
        - New language book
        - Deeper book for a current language
        - Framework book
        - New topic in an existing book
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: Language, framework or topic
      placeholder: TypeScript
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why you want it
      description: What would you build or learn with it?
