name: Bug report
description: Report wrong output, a broken page or a widget that does not respond.
labels: ["bug"]
body:
  - type: input
    id: chapter
    attributes:
      label: Book and chapter
      placeholder: Go ch9
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Panel or exercise
      placeholder: panel 14, or the second predict exercise
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What you saw
      description: Paste output or attach a screenshot.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and screen size
      placeholder: Firefox 140, phone
