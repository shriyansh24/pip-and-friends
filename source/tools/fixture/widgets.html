<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget Fixture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Bangers&family=Comic+Neue:wght@400;700&family=JetBrains+Mono:wght@500;600;800&family=Shantell+Sans:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../../assets/comic.css">
<link rel="stylesheet" href="../../assets/comic-widgets.css">
<script defer src="../../data/py-ch99.js"></script>
<script defer src="../../assets/comic.js"></script>
<script defer src="../../assets/comic-widgets.js"></script>
</head>
<body>
<main class="strip" id="strip">
  <section class="panel sketch" aria-label="Cast">
    <div class="row two">
      <svg class="char" data-char="professor"></svg><svg class="char" data-char="brick" data-label="42"></svg>
      <svg class="char" data-char="jelly" data-label="3.14"></svg><svg class="char" data-char="lamp" data-on="false"></svg>
      <svg class="char" data-char="ghost"></svg><svg class="char wide" data-char="train" data-text="Pip!"></svg>
      <svg class="char" data-char="signpost"></svg><svg class="char" data-char="wheel"></svg>
      <svg class="char wide" data-char="crate" data-items="7,'a',True"></svg><svg class="char" data-char="cabinet"></svg>
    </div>
  </section>

  <section class="panel clean tracer" aria-label="Tracer test" data-tracer="tr-model" id="tr1">
    <div class="tr-split"><ol class="tr-code"></ol><div class="screen"><p class="label">SCREEN</p><pre></pre></div></div>
    <div class="mem"><svg class="tracer-svg" id="tr1svg" role="img" aria-label="Memory diagram; the text version below lists every step."></svg></div>
    <p class="narration"></p>
    <div class="controls"><div class="btns">
      <button type="button" class="btn" data-act="prev">Back <kbd>←</kbd></button>
      <button type="button" class="btn btn-go" data-act="next">Next step <kbd>→</kbd></button>
      <button type="button" class="btn" data-act="play" aria-pressed="false"><span>Play</span> <kbd>Space</kbd></button>
      <button type="button" class="btn" data-act="reset">Reset <kbd>R</kbd></button>
    </div><span class="parity"></span></div>
    <p class="sr-only" aria-live="polite"></p>
    <details><summary>Text version: every step</summary><table class="transcript"><thead><tr><th>Step</th><th>Line</th><th>What happens</th><th>Memory</th><th>Screen</th></tr></thead><tbody></tbody></table></details>
    <script type="application/json" id="tr-model">{"program":"alias.py","steps":[
      {"line":1,"output":[],"frames":[{"name":"global","vars":[]}],"objects":{},"note":"Nothing exists yet."},
      {"line":2,"output":[],"frames":[{"name":"global","vars":[{"n":"a","ref":"L1"}]}],"objects":{"L1":{"kind":"list","items":[{"val":"1"},{"val":"2"}]}},"changed":["a"],"note":"A list is built; the tag <code>a</code> points at it."},
      {"line":3,"output":[],"frames":[{"name":"global","vars":[{"n":"a","ref":"L1"},{"n":"b","ref":"L1"}]}],"objects":{"L1":{"kind":"list","items":[{"val":"1"},{"val":"2"}]}},"changed":["b"],"note":"<code>b = a</code> makes a second tag on the <b>same</b> list."},
      {"line":4,"output":[],"frames":[{"name":"global","vars":[{"n":"a","ref":"L1"},{"n":"b","ref":"L1"}]}],"objects":{"L1":{"kind":"list","items":[{"val":"1"},{"val":"2"},{"val":"3"}]}},"changed":["a","b"],"note":"Appending through <code>b</code> changes the one list both tags point at."},
      {"line":5,"output":[],"frames":[{"name":"global","vars":[{"n":"a","ref":"L1"},{"n":"b","ref":"L1"},{"n":"c","ref":"s1"}]}],"objects":{"L1":{"kind":"list","items":[{"val":"1"},{"val":"2"},{"val":"3"}]},"s1":{"kind":"str","value":"'hi'"}},"changed":["c"],"note":"A string object, tagged <code>c</code>."},
      {"line":6,"output":["[1, 2, 3]"],"frames":[{"name":"global","vars":[{"n":"a","ref":"L1"},{"n":"b","ref":"L1"},{"n":"c","ref":"s1"}]}],"objects":{"L1":{"kind":"list","items":[{"val":"1"},{"val":"2"},{"val":"3"}]},"s1":{"kind":"str","value":"'hi'"}},"note":"Printing <code>a</code> shows the 3."},
      {"line":null,"output":["[1, 2, 3]","True"],"frames":[{"name":"global","vars":[{"n":"a","ref":"L1"},{"n":"b","ref":"L1"},{"n":"c","ref":"s1"}]}],"objects":{"L1":{"kind":"list","items":[{"val":"1"},{"val":"2"},{"val":"3"}]},"s1":{"kind":"str","value":"'hi'"}},"note":"<code>b is a</code> is True: same object."}
    ]}</script>
  </section>

  <section class="panel clean machine" aria-label="Machine test" data-machine="m-model">
    <div class="chips"></div><div class="machine-stage"></div><p class="narration"></p><span class="parity"></span><p class="sr-only" aria-live="polite"></p>
    <script type="application/json" id="m-model">{"label":"int()","program":"convert.py","examples":[
      {"in":"\"42\"","out":"42","outKind":"int","note":"Text that looks like a whole number becomes an int."},
      {"in":"3.9","out":"3","outKind":"int","note":"int() chops off the fraction. It does not round."},
      {"in":"\"hi\"","error":"ValueError: invalid literal for int() with base 10: 'hi'","note":"Not a number: the machine jams."}]}</script>
  </section>

  <section class="panel clean" aria-label="Exercises">
    <div class="score"><span data-score></span><button type="button" class="btn" data-score-reset>Reset my score</button></div>
    <div data-ex="predict" data-model="e1m" id="e1"></div><script type="application/json" id="e1m">{"program":"loop.py","hint":"Two numbers per line.","explain":"Each pass adds i to total."}</script>
    <div data-ex="predict" data-model="e2m" id="e2"></div><script type="application/json" id="e2m">{"program":"bug.py","expect":"error","explain":"nam was never created."}</script>
    <div data-ex="predict" data-model="e2bm" id="e2b"></div><script type="application/json" id="e2bm">{"program":"ask.py","prompt":"You type Ada then 36. What is on the screen?"}</script>
    <div data-ex="choice" data-model="e3m" id="e3"></div><script type="application/json" id="e3m">{"q":"What does <code>b = a</code> do with a list?","options":[{"t":"Copies the list","why":"No copy is made."},{"t":"Adds a second name for the same list","correct":true,"why":"Both tags point at one object."}]}</script>
    <div data-ex="parsons" data-model="e4m" id="e4"></div><script type="application/json" id="e4m">{"program":"alias.py","seed":3}</script>
    <div data-ex="fill" data-model="e5m" id="e5"></div><script type="application/json" id="e5m">{"program":"loop.py","blanks":[{"line":2,"text":"range(1, 4)","accept":["range(1, 4)","range(1,4)"]},{"line":4,"text":"total"}]}</script>
    <div data-ex="spot" data-model="e6m" id="e6"></div><script type="application/json" id="e6m">{"program":"bug.py","bug":2,"explain":"A typo: nam instead of name."}</script>
    <div data-ex="trace" data-model="e7m" id="e7"></div><script type="application/json" id="e7m">{"program":"loop.py","columns":["i","total"],"given":[0]}</script>
  </section>
  <section class="panel clean" aria-label="Terminal"><pre class="term" data-run="ask.py" data-exit></pre></section>
</main>
</body>
</html>
